[project]
name = "highwaynet-ai"
version = "0.2.0"
description = "Directed road-network structural analysis and infrastructure scenario research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "networkx>=3.4,<4", "osmnx>=2.0,<3", "geopandas>=1.0,<2", "shapely>=2.0,<3", "pandas>=2.2,<3", "numpy>=2.0,<3", "streamlit>=1.40,<2", "plotly>=5.24,<7", "folium>=0.18,<1", "pyproj>=3.6,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "pytest-cov>=6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
highwaynet = "highwaynet.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/highwaynet"]
